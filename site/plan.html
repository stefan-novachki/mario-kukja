<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kukja Mario — Floor plan</title>
<style>
  :root { --paper: #ebe6db; --ink: #2b2a29; --mute: #6f6a61; --line: #cfc7b8; --pass: #3f5b3a; --fail: #8a2f22; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 22px 28px 8px; flex-wrap: wrap; }
  h1 { font: 400 26px/1.2 "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; letter-spacing: .04em; margin: 0; }
  h1 small { display: block; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; letter-spacing: 0; color: var(--mute); margin-top: 4px; }
  .units { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .units button { border: 0; background: transparent; color: var(--mute); font: inherit; font-size: 13px; padding: 5px 14px; cursor: pointer; }
  .units button[aria-pressed="true"] { background: var(--ink); color: #f2eee5; }
  .sheet { margin: 8px 20px 0; background: #f2eee5; box-shadow: 0 1px 2px rgba(40,30,10,.12), 0 12px 40px rgba(40,30,10,.10); }
  .sheet svg { display: block; width: 100%; height: auto; }
  section { padding: 26px 28px 60px; max-width: 1180px; }
  h2 { font: 400 20px/1.3 "Palatino Linotype", Palatino, Georgia, serif; margin: 0 0 4px; }
  .sum { color: var(--mute); margin: 0 0 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 600; color: var(--mute); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 18px 8px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 8px; border-bottom: 1px solid #ddd5c6; vertical-align: top; }
  td.r, th.r { white-space: nowrap; }
  .sched td.r, .sched th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .sched tr.tot td { font-weight: 600; border-top: 1px solid var(--line); }
  .sched { max-width: 640px; }
  section + section { padding-top: 0; }
  .ok { color: var(--pass); font-weight: 600; } .no { color: var(--fail); font-weight: 600; }
  body.only header, body.only section { display: none; } body.only .sheet { margin: 0; box-shadow: none; }
  @media (max-width: 700px) { header, section { padding-left: 16px; padding-right: 16px; } .sheet { margin: 8px 0 0; } td:nth-child(4) { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Kukja Mario <small>Ground floor plan · pencil sketch, 1:100 on A2 · area schedule and plan checks</small></h1>
  <div class="units" role="group" aria-label="Units">
    <button data-u="metric" aria-pressed="true">m</button><button data-u="imperial" aria-pressed="false">ft-in</button>
  </div>
</header>
<div class="sheet" id="sheet"></div>
<section>
  <h2>Area schedule</h2>
  <p class="sum">Clear room sizes, inside the finished walls.</p>
  <table class="sched"><thead><tr><th>Room</th><th class="r">Clear size</th><th class="r">Area</th></tr></thead><tbody id="sched"></tbody></table>
</section>
<section>
  <h2>Plan checks</h2>
  <p class="sum" id="sum"></p>
  <table><thead></thead><tbody id="rows"></tbody></table>
</section>
<script type="module">
  import { renderSheet, scheduleRows } from './js/sketch.js';
  import { runChecks } from './js/checks.js';
  import { both, size, area } from './js/units.js';

  const params = new URLSearchParams(location.search);
  if (params.get('only') === 'sheet') document.body.classList.add('only');
  let units = params.get('u') || (() => { try { return localStorage.getItem('units') || 'metric'; } catch { return 'metric'; } })();

  function draw() {
    document.getElementById('sheet').innerHTML = renderSheet({ units });
    const vb = params.get('vb');
    if (vb) { const sv = document.querySelector('#sheet svg'); sv.setAttribute('viewBox', vb.split(',').join(' ')); sv.removeAttribute('width'); sv.removeAttribute('height'); }
    document.querySelectorAll('.units button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.u === units)));
    // area schedule (it used to sit beside the plan on the sheet)
    const sch = scheduleRows();
    const row = (a, b, c, cls = '') => `<tr class="${cls}"><td>${a}</td><td class="r">${b}</td><td class="r">${c}</td></tr>`;
    const live = sch.rows.filter((r) => r.living), serv = sch.rows.filter((r) => !r.living);
    document.getElementById('sched').innerHTML = live.map((r) => row(r.name, r.size ? size(r.w, r.d, units) : '—', area(r.area, units))).join('')
      + row('Net living area', '', area(sch.living, units), 'tot')
      + serv.map((r) => row(r.name, size(r.w, r.d, units), area(r.area, units))).join('')
      + row('Terrace', size(11.1, 2.8, units), area(sch.terrace, units))
      + row('Pergola', size(4.6, 3.9, units), area(sch.pergola, units));
  }
  document.querySelectorAll('.units button').forEach((b) => b.addEventListener('click', () => {
    units = b.dataset.u; try { localStorage.setItem('units', units); } catch {}
    draw();
  }));
  draw();

  const rows = runChecks();
  const tb = document.getElementById('rows');
  let g = '';
  for (const r of rows) {
    if (r.group !== g) { g = r.group; tb.insertAdjacentHTML('beforeend', `<tr><th colspan="4">${g}</th></tr>`); }
    const v = r.value == null ? (r.extra || '') : both(r.value) + (r.extra ? ` <span style="color:var(--mute)">(${r.extra})</span>` : '');
    tb.insertAdjacentHTML('beforeend', `<tr><td class="${r.pass ? 'ok' : 'no'}">${r.pass ? 'Pass' : 'Fail'}</td><td>${r.label}</td><td class="r">${v}</td><td>${r.req}</td></tr>`);
  }
  const n = rows.filter((r) => r.pass).length;
  document.getElementById('sum').textContent = `${n} of ${rows.length} checks pass. Every value is measured from the plan data the drawing is made from.`;
  document.body.dataset.ready = '1';
</script>
</body>
</html>
